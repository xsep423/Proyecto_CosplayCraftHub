name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pruebas de Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cosplaycrafthub
          POSTGRES_USER: cch
          POSTGRES_PASSWORD: cch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-solo-para-pruebas-no-usar-en-produccion
      DEBUG: 'False'
      DB_NAME: cosplaycrafthub
      DB_USER: cch
      DB_PASSWORD: cch
      DB_HOST: localhost
      DB_PORT: '5432'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
